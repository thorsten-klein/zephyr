description: |
  Texas Instruments BSH D-Bus-2 controller.

  Example:
    &spi0 {
      tdbus: bshbus@0 {
        compatible = "ti,bshbus";
        reg = <0>;
        spi-max-frequency = <20000000>;
        clock-frequency = <40000000>;
        irq-gpios = <&gpio0 5 (GPIO_ACTIVE_LOW | GPIO_PULL_UP)>;
        status = "okay";
      };
    };

compatible: "ti,bshbus"

include: ["spi-device.yaml"]

properties:
  clock-frequency:
    type: int
    enum:
      - 20000000
      - 40000000
    description: |
      Controller oscillator clock frequency in Hz (20MHz or 40MHz).

  irq-gpios:
    type: phandle-array
    required: true
    description: |
      GPIO connected to the nINT pin of the chip.
