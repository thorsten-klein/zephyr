description: |
  Texas Instruments BSH D-Bus-2 controller.

  Example:
    &spi0 {
      tdbus: bshbus@0 {
        compatible = ti,bshbus";
        reg = <0>;
        spi-max-frequency = <20000000>;
        clock-frequency = <40000000>;
        status = "okay";
      };
    };

compatible: "ti,bshbus"

include: ["spi-device.yaml"]

properties:
  clock-frequency:
    type: int
    enum:
      - 20000000
      - 40000000
    required: true
    description: |
      Controller oscillator clock frequency in Hz (20MHz or 40MHz).
